# Epok: own port and own base path, so each system acts as its own server.
spring.application.name=epok-service
server.port=8081
server.servlet.context-path=/epok

# --- DATABASE: own database per system (created by init-dbs.sql) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/epok_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
# Only Flyway migrations change the schema; Hibernate just checks that the entities match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#FLYWAY
spring.flyway.enabled=true
