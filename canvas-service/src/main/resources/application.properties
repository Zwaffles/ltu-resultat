# Canvas: own port and own base path, so each system acts as its own server.
spring.application.name=canvas-service
server.port=8084
server.servlet.context-path=/canvas

# Base URLs of the other systems that the process reg_Student_Resultat calls
tjanster.epok.url=http://localhost:8081/epok
tjanster.studentits.url=http://localhost:8082/studentits
tjanster.ladok.url=http://localhost:8083/ladok

# --- DATABASE: own database per system (created by init-dbs.sql) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/canvas_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
# TEMPORARY: Hibernate creates the tables until Flyway is in place (then: validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0