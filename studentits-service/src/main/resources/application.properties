# StudentITS: own port and own base path, so each system acts as its own server.
spring.application.name=studentits-service
server.port=8082
server.servlet.context-path=/studentits

# --- DATABASE: own database per system (created by init-dbs.sql) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/studentits_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
# TEMPORARY: Hibernate creates the tables until Flyway is in place (then: validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
