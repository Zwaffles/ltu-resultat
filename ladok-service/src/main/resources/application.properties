# Ladok: own port and own base path, so each system acts as its own server.
spring.application.name=ladok-service
server.port=8083
server.servlet.context-path=/ladok

# --- DATABASE: own database per system (created by init-dbs.sql) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ladok_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
# TEMPORARY: Hibernate creates the tables until Flyway is in place (then: validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false